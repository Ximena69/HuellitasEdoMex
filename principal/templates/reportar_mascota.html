
{% extends 'base.html' %}

{% block content %}

<section class="container py-5">

    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-7">

            <div class="card shadow-sm border-0">
                <div class="card-body p-4">

                    <h2 class="text-center mb-3">
                        Reportar mascota perdida o encontrada
                    </h2>

                    <p class="text-muted text-center mb-4">
                        Completa los datos para ayudar a localizar a una mascota.
                        Tu reporte será revisado por un administrador antes de publicarse.
                    </p>

                    <form method="POST" enctype="multipart/form-data">

                        {% csrf_token %}

                        {{ form.as_p }}

                        <div class="d-grid gap-2 mt-4">

                            <button type="submit" class="btn btn-primary">
                                Enviar reporte
                            </button>

                            <a href="{% url 'inicio' %}" class="btn btn-outline-secondary">
                                Cancelar
                            </a>

                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>

</section>

{% endblock %}
