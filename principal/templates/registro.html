{% extends 'base.html' %}

{% block title %}
Registro | Huellitas EdoMex
{% endblock %}

{% block content %}
<section class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card shadow border-0 p-4">
                <div class="card-body">
                    <h1 class="fw-bold mb-3">Crear una cuenta</h1>

                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} mb-3" role="alert">
                                {{ message }}
                            </div>
                        {% endfor %}
                    {% endif %}

                    <form method="post" action="{% url 'registro' %}">
                        {% csrf_token %}
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Nombre</label>
                                <input type="text" name="nombre" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Apellido</label>
                                <input type="text" name="apellido" class="form-control" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Nombre de Usuario</label>
                            <input type="text" name="username" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Correo Electrónico</label>
                            <input type="email" name="email" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">¿Qué deseas hacer?</label>
                            <select name="role" class="form-select" required>
                                <option value="INTERESADO">Quiero adoptar una mascota (Interesado)</option>
                                <option value="RESPONSABLE">Quiero dar en adopción (Responsable)</option>
                            </select>
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Contraseña</label>
                            <input type="password" name="password" class="form-control" required>
                        </div>
                        
                        <div class="form-check mb-4">
                            <input class="form-check-input" type="checkbox" id="checkLegal" required>
                            <label class="form-check-label small text-muted" for="checkLegal">
                                Acepto de conformidad los <a href="{% url 'terminos' %}" target="_blank" class="text-primary text-decoration-underline fw-bold">Términos y Condiciones</a> y el <a href="{% url 'privacidad' %}" target="_blank" class="text-primary text-decoration-underline fw-bold">Aviso de Privacidad</a> del sistema.
                            </label>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 fw-bold py-2">Crear Cuenta</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
